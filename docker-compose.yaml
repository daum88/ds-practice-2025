version: '3'

services:
  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html

  orchestrator:
    build:
      context: ./
      dockerfile: ./orchestrator/Dockerfile
    ports:
      - 8081:5000
    environment:
      - PYTHONUNBUFFERED=TRUE
    volumes:
      - ./orchestrator/src:/app/orchestrator/src
      - ./utils:/app/utils


  fraud_detection:
    build:
      context: ./
      dockerfile: ./fraud_detection/Dockerfile
    ports:
      - 50051:50051
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/fraud_detection/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./fraud_detection/src:/app/fraud_detection/src

  transaction_verification:
    build:
      context: ./
      dockerfile: ./transaction_verification/Dockerfile
    ports:
      - 50052:50052
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/transaction_verification/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./transaction_verification/src:/app/transaction_verification/src

  suggestions:
    build:
      context: ./
      dockerfile: ./suggestions/Dockerfile
    ports:
      - 50053:50053
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/suggestions/src/app.py
      - OPENAI_API_KEY={}
    volumes:
      - ./utils:/app/utils
      - ./suggestions/src:/app/suggestions/src

  order_queue:
    build:
      context: ./
      dockerfile: ./order_queue/Dockerfile
    ports:
      - 50054:50054
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_queue/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./order_queue/src:/app/order_queue/src

  order_executor_1:
    build:
      context: ./order_executor
    environment:
      - EXECUTOR_ID=1
      - KNOWN_IDS=1,2
    volumes:
      - ./order_executor/src:/app
      - ./utils/pb/order_queue/order_queue_pb2.py:/app/order_queue_pb2.py
      - ./utils/pb/order_queue/order_queue_pb2_grpc.py:/app/order_queue_pb2_grpc.py

  order_executor_2:
    build:
      context: ./order_executor
    environment:
      - EXECUTOR_ID=2
      - KNOWN_IDS=1,2
    volumes:
      - ./order_executor/src:/app
      - ./utils/pb/order_queue/order_queue_pb2.py:/app/order_queue_pb2.py
      - ./utils/pb/order_queue/order_queue_pb2_grpc.py:/app/order_queue_pb2_grpc.py

