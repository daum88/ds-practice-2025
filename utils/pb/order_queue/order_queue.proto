syntax = "proto3";
package order_queue;

message Order {
  string order_id = 1;
  string order_data = 2;
  int32 priority = 3;  // New field
}

message QueueResponse {
  bool success = 1;
  string message = 2;
}

message Empty {}

service OrderQueue {
  rpc Enqueue (Order) returns (QueueResponse);
  rpc Dequeue (Empty) returns (Order);
}
