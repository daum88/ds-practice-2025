syntax = "proto3";

package fraud_detection;

message PaymentInfo {
  string credit_card_number = 1;
  string expiration_date = 2;
  string cvv = 3;
}


message FraudCheckRequest {
  string order_id = 1; 
  string transaction_id = 2;
  PaymentInfo payment = 3;
  int32 amount = 4;
}

message FraudCheckResponse {
  bool is_fraudulent = 1;
  string message = 2;
}


message OrderInitRequest {
  string order_id = 1;
  string order_data = 2;
}

message OrderInitResponse {
  bool success = 1;
  string message = 2;
}

// NEW messages for event-based approach

message OrderEventRequest {
  string order_id = 1;
  repeated int32 vector_clock = 2;  // e.g. [0,0,0]
}

message OrderEventResponse {
  bool success = 1;
  string message = 2;
  repeated int32 updated_vc = 3;   // updated vector clock
}

message ClearOrderRequest {
  string order_id = 1;
  repeated int32 final_vc = 2;
}

message ClearOrderResponse {
  bool success = 1;
  string message = 2;
}


// The service definition

service FraudDetection {
  // Old single-call method (optional)
  rpc CheckFraud(FraudCheckRequest) returns (FraudCheckResponse);

  // For new flow
  rpc InitOrder(OrderInitRequest) returns (OrderInitResponse);

  // Event-based calls (d, e) in your partial order
  rpc CheckUserData(OrderEventRequest) returns (OrderEventResponse);
  rpc CheckCreditCard(OrderEventRequest) returns (OrderEventResponse);

  // Final cleanup
  rpc ClearOrder(ClearOrderRequest) returns (ClearOrderResponse);
}