syntax = "proto3";

package transaction_verification;

message User {
  string name = 1;
  string email = 2;
  string contact = 3;
  string address_line1 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
  string country = 8;
}

message PaymentInfo {
  string credit_card_number = 1;
  string expiration_date = 2;
  string cvv = 3;
}

message ShippingInfo {
  string shippingMethod = 1;
  bool gift_wrapping = 2;
}

message Book {
  string name = 1;
  int32 quantity = 2;
  string author = 3;
}

message OrderDetails {
  repeated Book books = 1;
  double total_amount = 2;
  string comment = 3;
}

message BillingAddress {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip = 4;
  string country = 5;
}


message TransactionValidationRequest {
  string transaction_id = 1;
  User user = 2;
  PaymentInfo payment = 3;
  string shippingMethod = 4;
  OrderDetails order = 5;
  string creditCard = 6;
  string userComment = 7;
  repeated Book items = 8;
  BillingAddress billingAddress = 9;
  bool giftWrapping = 10;
  bool termsAccepted = 11;
  string author = 12;
  string order_id = 13; // for associating with the new flow
}

message TransactionValidationResponse {
  bool valid = 1;
  string message = 2;
}

// Order initialization

message OrderInitRequest {
  string order_id = 1;
  string order_data = 2;
}

message OrderInitResponse {
  bool success = 1;
  string message = 2;
}


message OrderEventRequest {
  string order_id = 1;
  repeated int32 vector_clock = 2;  // e.g. [0,0,0]
}

message OrderEventResponse {
  bool success = 1;
  string message = 2;
  repeated int32 updated_vc = 3;   // the service's new vector clock after merging + incrementing
}


message ClearOrderRequest {
  string order_id = 1;
  repeated int32 final_vc = 2;
}

message ClearOrderResponse {
  bool success = 1;
  string message = 2;
}


// The service definition
service TransactionVerification {
  // Old single-call approach (optional):
  rpc ValidateTransaction(TransactionValidationRequest) returns (TransactionValidationResponse);

  // Init / store data
  rpc InitOrder(OrderInitRequest) returns (OrderInitResponse);

  // New event-based calls
  rpc VerifyItems(OrderEventRequest) returns (OrderEventResponse);
  rpc VerifyUserData(OrderEventRequest) returns (OrderEventResponse);
  rpc VerifyCreditCard(OrderEventRequest) returns (OrderEventResponse);

  // Final cleanup
  rpc ClearOrder(ClearOrderRequest) returns (ClearOrderResponse);
}
